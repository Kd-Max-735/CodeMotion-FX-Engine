<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>CodeMotion T08 Text Extrude 3D Preview</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; background: #09101f; color: #e9f2ff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    article { padding: 18px; border: 1px solid #29456a; border-radius: 14px; background: #101c32; }
    canvas { width: 640px; max-width: 82vw; image-rendering: pixelated; border-radius: 8px; background: #050913; }
    h1 { margin: 12px 0 4px; font-size: 18px; }
    p { margin: 0 0 10px; color: #9bb0ce; }
    label { display: flex; gap: 10px; align-items: center; }
    input { flex: 1; }
  </style>
</head>
<body id="T08">
  <article>
    <canvas width="160" height="90" aria-label="T08 deterministic extruded 3D text preview"></canvas>
    <h1>Text Extrude 3D</h1>
    <p>fx.text.textExtrude3D · EffectTimeSample 1.1 / Unicode glyph raster</p>
    <label>Text <select><option>立体</option><option>FX</option><option>AΩ</option></select></label>
    <label>Progress <input type="range" min="0" max="1" step="0.25" value="0.5"><output>50%</output></label>
  </article>
  <script type="module">
    import {
      TEXT_EXTRUDE_3D,
      createTextExtrude3DWebGLPass,
      createTextExtrusionGeometry,
      makeTextExtrudeRasterFixture,
      normalizeTextExtrude3DParams
    } from "./dist/index.js";
    import { resolveEffectTimeSample, resolveLayerTimeSample, resolveProjectTimeSample } from "../timeline/dist/index.js";
    const canvas = document.querySelector("canvas");
    const slider = document.querySelector("input");
    const textPicker = document.querySelector("select");
    const output = document.querySelector("output");
    const duration = 7.3;
    const fps = 48;
    const transform = {
      anchorPoint: { mode: "constant", value: { x: 0, y: 0, z: 0 } },
      position: { mode: "constant", value: { x: 0, y: 0, z: 0 } },
      scale: { mode: "constant", value: { x: 100, y: 100, z: 100 } },
      rotation: { mode: "constant", value: { x: 0, y: 0, z: 0 } }
    };
    const gl = canvas.getContext("webgl2", { alpha: true, preserveDrawingBuffer: true });
    if (!gl) throw new Error("T08 preview requires WebGL2.");
    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || "T08 shader compile failed.");
      }
      return shader;
    }
    function renderAt(progress) {
      const text = textPicker.value;
      const instance = {
        id: `preview.t08.${text}`,
        effectId: TEXT_EXTRUDE_3D.effectId,
        version: TEXT_EXTRUDE_3D.version,
        enabled: true,
        startTime: 0,
        endTime: duration,
        mix: { mode: "constant", value: 1 },
        params: TEXT_EXTRUDE_3D.defaultPreset
      };
      const layer = {
        id: `preview.layer.${text}`,
        type: "null",
        name: "T08 preview",
        visible: true,
        locked: false,
        solo: false,
        startTime: 41,
        endTime: 41 + duration,
        inPoint: 0,
        outPoint: duration,
        zIndex: 0,
        transform,
        opacity: { mode: "constant", value: 1 },
        blendMode: "normal",
        masks: [],
        effects: [instance],
        properties: {}
      };
      const projectTime = layer.startTime + progress * duration;
      const project = resolveProjectTimeSample({
        projectTime,
        previousProjectTime: Math.max(layer.startTime, projectTime - 1 / fps),
        fps
      });
      const layerTime = resolveLayerTimeSample(layer, project);
      const time = resolveEffectTimeSample(instance, layerTime, project, duration);
      const textRaster = makeTextExtrudeRasterFixture(text, canvas.width, canvas.height, layerTime);
      const params = normalizeTextExtrude3DParams(TEXT_EXTRUDE_3D.defaultPreset);
      const geometry = createTextExtrusionGeometry(textRaster, params, "preview");
      const pass = createTextExtrude3DWebGLPass(params, time, "preview", geometry);
      output.value = `${Math.round(progress * 100)}%`;
      const vertexShader = compile(gl.VERTEX_SHADER, pass.vertexSource);
      const fragmentShader = compile(gl.FRAGMENT_SHADER, pass.geometryFragmentSource);
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "T08 geometry link failed.");
      }
      const vertexArray = gl.createVertexArray();
      const vertexBuffer = gl.createBuffer();
      const indexBuffer = gl.createBuffer();
      gl.bindVertexArray(vertexArray);
      gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, pass.geometry.vertices, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, pass.geometry.indices, gl.STATIC_DRAW);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(program);
      for (const [name, value] of Object.entries(pass.uniforms)) {
        if (typeof value !== "number") continue;
        const location = gl.getUniformLocation(program, name);
        if (location) gl.uniform1f(location, value);
      }
      gl.uniform1f(gl.getUniformLocation(program, "u_mask"), 1);
      gl.drawElements(gl.TRIANGLES, pass.geometry.indices.length, gl.UNSIGNED_INT, 0);
      const pixels = new Uint8Array(canvas.width * canvas.height * 4);
      gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      let fingerprint = 0x811c9dc5;
      for (const byte of pixels) {
        fingerprint ^= byte;
        fingerprint = Math.imul(fingerprint, 0x01000193);
      }
      gl.deleteBuffer(indexBuffer);
      gl.deleteBuffer(vertexBuffer);
      gl.deleteVertexArray(vertexArray);
      gl.deleteProgram(program);
      gl.deleteShader(fragmentShader);
      gl.deleteShader(vertexShader);
      document.body.dataset.rendered = "true";
      document.body.dataset.webgl2 = "true";
      document.body.dataset.resources = "balanced";
      document.body.dataset.fingerprint = (fingerprint >>> 0).toString(16).padStart(8, "0");
      return document.body.dataset.fingerprint;
    }
    function render() {
      renderAt(Number(slider.value));
    }
    const webglSamples = [];
    const webglGoldens = Object.fromEntries(
      [0, 0.25, 0.5, 0.75, 1].map((progress) => {
        const started = performance.now();
        const hash = renderAt(progress);
        webglSamples.push(performance.now() - started);
        return [String(progress), hash];
      })
    );
    webglSamples.sort((left, right) => left - right);
    document.body.dataset.webglGoldens = JSON.stringify(webglGoldens);
    document.body.dataset.webglMedianMs = webglSamples[Math.floor(webglSamples.length / 2)].toFixed(3);
    slider.addEventListener("input", render);
    textPicker.addEventListener("change", render);
    render();
  </script>
</body>
</html>
